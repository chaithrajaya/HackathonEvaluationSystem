spring.application.name=HackathonEvaluator

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/hackathon_evaluator
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=MySecretKey1234567890123456789012345678901234567890123456789012345678901234567890
app.jwt.expiration=86400000

# Server Configuration
server.port=8080